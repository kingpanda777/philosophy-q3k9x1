<!DOCTYPE html>
<html lang="ja" style="background:#0D1117">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<title>概念のノート</title>
<style>
:root{
  --bg:#0D1117;
  --card:#151B23;
  --card-2:#1B222C;
  --line:#262E39;
  --ink:#E6EDF3;
  --muted:#8B949E;
  --accent:#4A8FD4;
  --accent-dim:#1F3B58;
  --brass:#C9A227;
  --ok:#3FB950;
  --ng:#E5534B;
  --uv-head:#B6C0CB;
  --display:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --gothic:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--gothic);
  font-size:15px;line-height:1.7;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 64px}

/* ---------- ヘッダ ---------- */
.masthead{padding:30px 0 18px}
.masthead h1{font-family:var(--display);font-weight:700;font-size:27px;letter-spacing:.02em;margin:0}
.masthead p{margin:7px 0 0;font-size:13px;color:var(--muted)}

/* ---------- タブ ---------- */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.limitbar{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:12px;color:var(--muted)}
.limitbar .lb{margin-right:2px}
.lim{
  appearance:none;cursor:pointer;font-family:inherit;font-size:12.5px;
  background:var(--card);color:var(--muted);border:1px solid var(--line);
  padding:6px 12px;border-radius:99px;
}
.lim[aria-pressed="true"]{background:var(--accent-dim);color:var(--ink);border-color:var(--accent)}
.lim:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{
  display:flex;gap:7px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  appearance:none;cursor:pointer;font-family:inherit;font-size:12.5px;white-space:nowrap;flex:0 0 auto;
  background:var(--card);color:var(--muted);border:1px solid var(--line);
  padding:7px 13px;border-radius:99px;
}
.chip[aria-pressed="true"]{background:var(--accent-dim);color:var(--ink);border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grp{
  display:flex;align-items:baseline;gap:9px;margin:20px 0 9px;
  font-family:var(--display);font-size:13px;font-weight:600;color:var(--muted);
}
.grp:first-of-type{margin-top:4px}
.grp span{font-size:11px;font-weight:400}
.tab{
  appearance:none;flex:1;cursor:pointer;font-family:inherit;font-size:13.5px;
  background:var(--card);color:var(--muted);border:1px solid var(--line);
  padding:11px 6px;border-radius:12px;
}
.tab[aria-selected="true"]{background:var(--accent-dim);color:var(--ink);border-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 副タブ（概念から／鍵語から）---------- */
.subtabs{display:flex;gap:6px;margin:0 0 12px}
.subtab{
  appearance:none;flex:1;cursor:pointer;font-family:inherit;font-size:12.5px;
  background:none;color:var(--muted);border:1px solid var(--line);
  padding:8px 6px;border-radius:99px;
}
.subtab[aria-selected="true"]{background:var(--card-2);color:var(--ink);border-color:var(--accent)}
.subtab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 鍵語の検索と一覧 ---------- */
.ksearch{
  width:100%;appearance:none;font-family:inherit;font-size:16px;
  background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;margin:0 0 6px;
}
.ksearch::placeholder{color:var(--muted)}
.ksearch:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.kcount{margin:0 0 10px;font-size:11.5px;color:var(--muted)}
.krow{
  display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;cursor:pointer;
  font-family:inherit;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;margin-bottom:6px;
}
.krow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.krow-name{font-family:var(--display);font-size:15.5px;font-weight:600;flex:0 0 auto}
.krow-who{font-size:11.5px;color:var(--muted);flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.krow-n{font-size:11.5px;color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums}
.kbadge{
  font-size:10.5px;color:var(--accent);background:var(--accent-dim);
  border-radius:6px;padding:2px 6px;flex:0 0 auto;
}
.kgrp{
  display:flex;align-items:baseline;gap:8px;margin:18px 0 7px;
  font-family:var(--display);font-size:13px;font-weight:600;color:var(--uv-head);
}
.kgrp span{font-size:11px;font-weight:400;color:var(--muted)}
.gyoidx{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 4px}
.gyobtn{
  appearance:none;cursor:pointer;font-family:inherit;font-size:13px;
  background:var(--card-2);color:var(--ink);border:1px solid var(--line);
  min-width:38px;padding:7px 0;border-radius:9px;
}
.gyobtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.today{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 4px}
.todaychip{
  appearance:none;cursor:pointer;font-family:inherit;font-size:14px;text-align:left;
  background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-left:2px solid var(--brass);
  padding:9px 12px;border-radius:10px;line-height:1.5;
}
.todaychip span{display:block;font-size:11px;color:var(--muted)}
.todaychip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 一覧 ---------- */
.row{
  display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:15px 16px;margin-bottom:10px;
}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row[disabled]{opacity:.4;cursor:default}
.row-head{display:flex;align-items:baseline;gap:10px}
.row-name{font-family:var(--display);font-size:18px;font-weight:600}
.row-years{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.row-note{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.65}
.row-meta{margin:8px 0 0;font-size:11.5px;color:var(--muted)}
.row-users{
  display:inline-block;margin:8px 0 0;font-size:12px;color:var(--accent);
  background:var(--accent-dim);border-radius:8px;padding:3px 9px;line-height:1.6;
}

/* ---------- お気に入り ---------- */
.row-wrap{position:relative}
.row-wrap .row{padding-right:56px}
.fav{
  position:absolute;top:0;right:0;appearance:none;background:none;border:0;padding:0;
  width:52px;height:52px;cursor:pointer;font-size:19px;line-height:1;color:#46515F;
}
.fav.on{color:var(--brass)}
.fav:focus-visible{outline:2px solid var(--accent);outline-offset:-5px;border-radius:14px}
.favbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.favchip{
  appearance:none;cursor:pointer;font-family:inherit;font-size:13.5px;
  background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-left:2px solid var(--brass);
  padding:10px 13px;border-radius:10px;line-height:1.5;
}
.favchip span{margin-left:8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.favchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 用語の見取り図 ---------- */
.back{
  appearance:none;background:none;border:0;padding:16px 0 10px;cursor:pointer;
  font-family:inherit;font-size:13px;color:var(--muted);
}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.term-title{font-family:var(--display);font-weight:700;font-size:28px;margin:2px 0 6px}
.term-note{margin:0 0 18px;font-size:13px;color:var(--muted)}
.who{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin:0 0 20px}
.who-item{padding:13px 0;border-bottom:1px solid var(--line)}
.who-item:last-child{border-bottom:0}
.who-name{font-family:var(--display);font-size:16px;font-weight:600}
.who-note{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.65}

/* ---------- ボタン ---------- */
.btn{
  appearance:none;width:100%;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;
  background:var(--accent);color:#0B1017;border:1px solid var(--accent);
  padding:15px;border-radius:12px;
}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line);font-weight:400}
.btn+.btn{margin-top:10px}
.btn[disabled]{opacity:.4;cursor:default}

/* ---------- 出題 ---------- */
.q-bar{display:flex;align-items:center;gap:12px;padding:8px 0 10px;font-size:12px;color:var(--muted)}
.q-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quitbtn{
  appearance:none;background:none;border:0;flex:none;cursor:pointer;font-family:inherit;
  font-size:12px;color:var(--muted);padding:10px 12px 10px 0;
  text-decoration:underline;text-underline-offset:3px;
}
.quitbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q-bar b{
  font-weight:600;font-size:17px;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.2;
}
.gauge{height:5px;background:var(--card);border-radius:99px;margin-bottom:20px;overflow:hidden}
.gauge span{display:block;height:5px;background:var(--accent);transition:width .25s ease}
.q-tags{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.q-text{
  font-family:var(--display);font-size:18px;font-weight:600;line-height:1.75;margin:0 0 18px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
}
.choice{
  display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;
  background:var(--card-2);color:var(--ink);border:1px solid var(--line);
  padding:14px 15px;margin-bottom:10px;border-radius:12px;font-size:14.5px;line-height:1.65;
}
.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choice.is-correct{border-color:var(--ok);background:#132318}
.choice.is-wrong{border-color:var(--ng);background:#2A1614}
.choice.is-dim{opacity:.45}
.choice[disabled]{cursor:default}

/* ---------- 解説 ---------- */
.verdict{font-family:var(--display);font-weight:700;font-size:17px;margin:22px 0 10px}
.verdict.ok{color:var(--ok)}
.verdict.ng{color:var(--ng)}
.explain{
  font-size:14px;line-height:1.85;margin:0 0 14px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;
}
.src{display:inline-block;font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.src.book{border-color:var(--ok);color:var(--ok)}
.flagbtn{
  appearance:none;background:none;border:0;padding:10px 0;margin-left:12px;cursor:pointer;
  font-family:inherit;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;
}
.flagbtn.on{color:var(--brass);text-decoration:none}
.flagbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot{margin-top:18px}
.detail{
  font-size:13.5px;line-height:1.9;margin:0 0 14px;color:var(--ink);
  background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:12px;padding:15px;white-space:pre-wrap;
}
.unverified{
  font-size:12.5px;line-height:1.85;margin:-4px 0 14px;color:var(--muted);
  border:1px dashed var(--line);border-radius:12px;padding:13px 15px;
}
.unverified b{
  display:block;font-weight:500;font-size:12.5px;letter-spacing:.02em;
  margin:0 0 7px;color:var(--uv-head);opacity:1;
}
.more{
  appearance:none;width:100%;cursor:pointer;font-family:inherit;font-size:13px;
  background:none;color:var(--accent);border:1px solid var(--line);
  padding:11px;border-radius:12px;margin:0 0 14px;
}
.more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.more.want{color:var(--muted)}
.more.want.on{color:var(--brass);border-color:var(--brass)}
.dig{margin:16px 0 0}
.dig-head{font-size:12px;color:var(--muted);margin:0 0 8px}
.dig-item{
  display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;color:inherit;
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:13.5px;line-height:1.6;
}
.dig-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dig-tag{display:block;font-size:11px;color:var(--accent);margin-bottom:4px}
.dig-why{display:block;font-size:11px;color:var(--muted);margin-top:5px}

/* ---------- 結果 ---------- */
.score{
  font-family:var(--display);font-weight:700;font-size:52px;margin:24px 0 0;
  font-variant-numeric:tabular-nums;text-align:center;
}
.score small{font-size:18px;color:var(--muted);margin-left:6px;font-weight:400}
.score-note{margin:2px 0 24px;font-size:13px;color:var(--muted);text-align:center}

/* ---------- 全問一周 ---------- */
.cycbtn{
  appearance:none;display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;color:inherit;
  background:var(--card);border:1px solid var(--line);border-left:2px solid var(--brass);
  border-radius:12px;padding:12px 14px;margin:0 0 14px;
}
.cycbtn b{font-family:var(--display);font-size:15px;font-weight:600}
.cycbtn span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.cycbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrongrow{
  display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;margin-bottom:8px;font-size:13.5px;line-height:1.7;
}
.wrongrow span{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.wrongrow[aria-expanded="true"]{border-color:var(--accent);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.wrongrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 記録 ---------- */
.stat{
  display:flex;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:16px;margin-bottom:6px;
}
.stat div{flex:1;text-align:center}
.stat-num{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.stat-lab{font-size:11.5px;color:var(--muted)}
.sec-title{font-family:var(--display);font-weight:600;font-size:14px;margin:24px 0 10px;color:var(--muted)}
.empty{font-size:13px;color:var(--muted);padding:0;line-height:1.8}
.mini{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;margin-bottom:8px;font-size:13.5px;line-height:1.7;
}
.mini span{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.danger{
  appearance:none;background:none;border:0;padding:0;margin:34px 0 0;cursor:pointer;
  font-family:inherit;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- 哲学者紹介シート（⑧） ---------- */
.philbtn{
  appearance:none;background:none;border:0;padding:0;margin:0;cursor:pointer;
  font:inherit;color:inherit;text-align:inherit;
}
.philbtn .info{
  font-size:9.5px;color:var(--muted);vertical-align:.25em;margin-left:3px;
  border:1px solid var(--line);border-radius:99px;padding:0 3px;line-height:1.5;
}
.philbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q-bar .philbtn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:10px 0}
.q-bar .quitbtn{padding-right:22px}
.q-tags .philbtn{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}

#sheet-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;
  opacity:0;transition:opacity .18s ease;
}
#sheet-bg[hidden]{display:none}
#sheet-bg.show{opacity:1}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:var(--card);border-top:1px solid var(--line);
  border-radius:14px 14px 0 0;
  max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 16px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s ease;
}
#sheet[hidden]{display:none}
#sheet.show{transform:translateY(0)}
.sheet-in{max-width:560px;margin:0 auto}
.grip{width:36px;height:4px;border-radius:99px;background:var(--line);margin:10px auto 14px}
.ph-name{font-family:var(--display);font-weight:700;font-size:22px;margin:0;line-height:1.35}
.ph-yomi{font-size:11.5px;color:var(--muted);margin:2px 0 0}
.ph-meta{font-size:12px;color:var(--muted);margin:10px 0 0;
  padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ph-meta span+span::before{content:"｜";margin:0 7px;color:var(--line)}
.ph-intro{font-size:14px;margin:14px 0 0}
.ph-thought{font-size:14px;margin:0;color:var(--ink)}
.ph-h{font-size:11px;color:var(--muted);margin:18px 0 6px;letter-spacing:.06em}
.ph-works{list-style:none;margin:0;padding:0}
.ph-works li{font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;gap:12px}
.ph-works li:last-child{border-bottom:0}
.ph-works em{font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.ph-keys{display:flex;flex-wrap:wrap;gap:6px}
.ph-key{font-size:11.5px;color:var(--muted);background:var(--card-2);
  border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.ph-more{appearance:none;cursor:pointer;font-family:inherit;color:var(--accent);border-color:var(--accent-dim)}
.ph-more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ph-count{font-size:12px;color:var(--muted);margin:16px 0 0}
.ph-close{
  appearance:none;width:100%;margin-top:18px;cursor:pointer;font-family:inherit;
  background:var(--card-2);color:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:12px;font-size:14px;
}
.ph-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 人物モードの結果画面に置く紹介カード（シートではない） */
.ph-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px 16px;margin-top:22px}
.ph-card .ph-name{font-size:19px}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>概念のノート</h1>
    <p>同じ語でも、誰が使うかで中身が変わる</p>
  </header>
  <main id="app"></main>
</div>

<div id="sheet-bg" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="哲学者の紹介"></div>

<script src="questions.js"></script>
<script src="philosophers.js"></script>
<script>
"use strict";

/* ========== 保存まわり ========== */
const KEY = "philo-quiz-v1";
const blank = { results:{}, flags:{}, wants:{}, favs:{}, limit:10 };
let store = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(blank);
    const p = JSON.parse(raw);
    return { results: p.results || {}, flags: p.flags || {}, wants: p.wants || {}, favs: p.favs || {}, limit: p.limit || 10 };
  }catch(e){ return structuredClone(blank); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ /* 保存できなくても出題は続行する */ }
}
function record(id, ok){
  const r = store.results[id] || { ok:0, ng:0 };

  save();
}

const byPhilosopher = n => QUESTIONS.filter(q => q.philosophers.includes(n));

/* ========== 哲学者紹介（⑧） ==========
   PHIL_INTRO は philosophers.js。questions.js の PHILOSOPHERS とは別物で、
   あちらが一覧の見出し、こちらが紹介シートの中身。
   問題数と鍵語はデータに書かず、QUESTIONS から出す。
   照合前（checked が false）と、そもそも載っていない人物は入口を出さない。 */
const PHIL_MAP = {};
if(typeof PHIL_INTRO !== "undefined"){
  PHIL_INTRO.forEach(p => { if(p.checked) PHIL_MAP[p.name] = p; });
}
const hasIntro = n => Object.prototype.hasOwnProperty.call(PHIL_MAP, n);

/* その人の問題に付いている鍵語を集めて、鍵語タブと同じ読み順に並べる */
/* その人の問題に付いている鍵語のうち、台帳でその人に登録されている語だけを残す。
   集めるだけだと比較問題の相手側の語が混ざる（カントに一般意志・原初状態・
   純粋持続・他者危害原則が出ていた）。KEY_OWNER は philosophers.js の生成ブロック。
   規則3の二人語（贈与・真正性など）は両方の人物に登録されているので両方に出る。 */
function philKeys(name){
  const set = new Set();
  byPhilosopher(name).forEach(q => (q.keys || []).forEach(k => set.add(k)));
  const owner = (typeof KEY_OWNER !== "undefined") ? KEY_OWNER : {};
  return [...set]
    .filter(k => (owner[k] || []).includes(name))
    .sort((a,b) => yomiOf(a).localeCompare(yomiOf(b), "ja"));
}

/* 人物名を、紹介のある人だけボタンにする。無い人はただの文字のまま */
function philLink(name){
  if(!hasIntro(name)) return esc(name);
  return `<button class="philbtn" data-ph="${esc(name)}" aria-label="${esc(name)}の紹介を開く">${esc(name)}<span class="info">ⓘ</span></button>`;
}

/* シートと結果カードで同じ中身を使う */
const KEY_CAP = 12;   /* 鍵語チップの既定の表示数 */

function philBodyHTML(p, full){
  const n = byPhilosopher(p.name).length;
  const keys = philKeys(p.name);
  /* 生没年と学派は PHILOSOPHERS 側だけが持っている。紹介データには重ねない */
  const b = PHILOSOPHERS.find(x => x.name === p.name) || {};
  let h = `<p class="ph-name">${esc(p.name)}</p>
    <p class="ph-yomi">${esc(p.yomi)}</p>
    <p class="ph-meta"><span>${esc(b.years || "")}</span><span>${esc(p.place)}</span><span>${esc(b.school || "")}</span></p>
    <p class="ph-intro">${esc(p.intro)}</p>`;
  if(p.thought){
    h += `<p class="ph-h">問い</p><p class="ph-thought">${esc(p.thought)}</p>`;
  }
  if(p.works && p.works.length){
    h += `<p class="ph-h">主要著作</p><ul class="ph-works">` +
      p.works.map(w => `<li><span>『${esc(w.title)}』</span>${w.year ? `<em>${w.year}</em>` : ""}</li>`).join("") +
      `</ul>`;
  }
  if(keys.length){
    /* 多い人は12個で切る。「＋N」を押すと残りが出る */
    const cut = (!full && keys.length > KEY_CAP) ? KEY_CAP : keys.length;
    h += `<p class="ph-h">この人の鍵語</p><div class="ph-keys">` +
      keys.slice(0, cut).map(k => `<span class="ph-key">${esc(k)}</span>`).join("") +
      (cut < keys.length
        ? `<button class="ph-key ph-more" data-phmore="${esc(p.name)}">＋${keys.length - cut}</button>`
        : "") +
      `</div>`;
  }
  h += `<p class="ph-count">この本に${n}問</p>`;
  return h;
}

const sheetBg = document.getElementById("sheet-bg");
const sheetEl = document.getElementById("sheet");

function openSheet(name, full){
  const p = PHIL_MAP[name];
  if(!p) return;
  const keep = (!sheetEl.hidden) ? sheetEl.scrollTop : 0;
  sheetEl.innerHTML = `<div class="sheet-in"><div class="grip"></div>` + philBodyHTML(p, full) +
    `<button class="ph-close" data-phclose="1">閉じる</button></div>`;
  if(!sheetEl.hidden){ sheetEl.scrollTop = keep; return; }   /* ＋N の押し直しでは開き直さない */
  sheetBg.hidden = false; sheetEl.hidden = false;
  sheetEl.scrollTop = 0;
  requestAnimationFrame(() => { sheetBg.classList.add("show"); sheetEl.classList.add("show"); });
}

function closeSheet(){
  if(sheetEl.hidden) return;
  sheetBg.classList.remove("show"); sheetEl.classList.remove("show");
  setTimeout(() => { sheetBg.hidden = true; sheetEl.hidden = true; sheetEl.innerHTML = ""; }, 200);
}

sheetBg.addEventListener("click", closeSheet);
sheetEl.addEventListener("click", e => {
  const more = e.target.closest("[data-phmore]");
  if(more) return openSheet(more.dataset.phmore, true);   /* 鍵語を全部出す */
  if(e.target.closest("[data-phclose]")) closeSheet();
});
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });

/* 下スワイプで閉じる。中身をスクロールしている途中は効かせない */
let swY = null;
sheetEl.addEventListener("touchstart", e => {
  swY = sheetEl.scrollTop <= 0 ? e.touches[0].clientY : null;
}, { passive:true });
sheetEl.addEventListener("touchmove", e => {
  if(swY === null) return;
  const dy = e.touches[0].clientY - swY;
  if(dy > 0) sheetEl.style.transform = `translateY(${dy}px)`;
}, { passive:true });
sheetEl.addEventListener("touchend", e => {
  if(swY === null) return;
  const dy = (e.changedTouches[0].clientY - swY);
  sheetEl.style.transform = "";
  swY = null;
  if(dy > 70) closeSheet();
}, { passive:true });

/* 鍵語の索引。keyterms.json は読まない（台帳であって配信データではない）。

  const m = new Map();
  QUESTIONS.forEach(q => (q.keys || []).forEach(k => {
    if(!m.has(k)) m.set(k, []);
    m.get(k).push(q);
  }));
  return m;
})();
const byKey = k => KEY_INDEX.get(k) || [];

const yomiOf = w => KEY_YOMI[w] || w;
const toHira = s => s.replace(/[ァ-ヴ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const kanaKey = w => toHira(yomiOf(w));

/* 五十音の行。読みの先頭の1文字で振り分ける */
const GYO = [
  ["あ","あいうえおぁぃぅぇぉゔ"], ["か","かきくけこがぎぐげご"], ["さ","さしすせそざじずぜぞ"],
  ["た","たちつてとだぢづでどっ"], ["な","なにぬねの"], ["は","はひふへほばびぶべぼぱぴぷぺぽ"],
  ["ま","まみむめも"], ["や","やゆよゃゅょ"], ["ら","らりるれろ"], ["わ","わをんゎ"]
];
const gyoOf = w => { const c = kanaKey(w)[0] || ""; const g = GYO.find(x => x[1].includes(c)); return g ? g[0] : "他"; };

/* 鍵語タブに並べる行 */
const KEY_ROWS = (() => {
  const rows = [...KEY_INDEX.entries()].map(([name, qs]) => ({ name, kind:"key", qs }));
  CONCEPT_ALSO_KEY.forEach(name => { if(TERMS.some(t => t.name === name)) rows.push({ name, kind:"concept", qs:byTerm(name) }); });
  rows.forEach(r => {
    r.yomi = yomiOf(r.name);
    r.gyo  = gyoOf(r.name);
    /* 人物ごとの見出しに使う人物。複数人に付く語は philosophers の先頭 */
    const seen = [];
    r.qs.forEach(q => q.philosophers.forEach(n => { if(!seen.includes(n)) seen.push(n); }));
    r.who = seen;
    r.head = seen[0] || "—";
  });
  return rows;
})();
const byCount = (a,b) => b.qs.length - a.qs.length || kanaKey(a.name).localeCompare(kanaKey(b.name), "ja");
const byKana  = (a,b) => kanaKey(a.name).localeCompare(kanaKey(b.name), "ja");
const shuffle = a => { const x = a.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; };

function related(q, exclude){
  const scored = QUESTIONS.map(o => {
    if(o.id === q.id || exclude.has(o.id)) return null;
    let s = 0; const why = [];
    q.terms.forEach(t => {
      if(!o.terms.includes(t)) return;
      const others = o.philosophers.filter(p => !q.philosophers.includes(p));
      if(others.length){ s += 3; why.push(t + "／" + others.join("・")); }
      else { s += 2; why.push(t); }
    });
    const samePhil = o.philosophers.filter(p => q.philosophers.includes(p));
    if(samePhil.length && !why.length){ s += 1; why.push(samePhil.join("・")); }
    else if(samePhil.length) s += 1;
    if(s > 0 && o.type === "compare") s += 1;   // 実際の共通点がある場合のみ加点
    return s >= 2 ? { q:o, s, why:[...new Set(why)].join("　") } : null;  // 用語の共有がない弱い関連は出さない
  }).filter(Boolean);
  scored.sort((a,b) => b.s - a.s);
  return scored.slice(0,3);
}

/* ========== 全問一周 ==========
   全問を一度ずつ解くモード。既存の出題画面をそのまま使い、
   「いま何問目か」と「間違えた id」だけを別に持つ。

   保存は既存の philo-quiz-v1 とは別のキーにしてある。
   記録を消しても一周の途中が消えないようにするため。形は次のとおり。

     philo-cycle-v1 = {
       order : ["q123", ...]   出題順。開始時にシャッフルして固定する
       pos   : 0               次に出す位置。1問答えるたびに書き戻す
       wrong : ["q..."]        この周で間違えた id
       mode  : "all" | "wrong" 全問の周か、間違えた問題だけの周か
       round : 1               間違えた問題だけの周を重ねた回数
       done  : false           この周を解き終えたか
     }

   order を固定するのは、途中でやめても同じ続きから戻れるようにするため。
   後から問題が増えたら、続きから再開するときに末尾へシャッフルして足す。 */
const CKEY = "philo-cycle-v1";
const QMAP = new Map(QUESTIONS.map(q => [q.id, q]));
let cyc = loadCycle();
let cycOpen = {};             // 終了画面で解説を開いている id

function loadCycle(){
  try{
    const raw = localStorage.getItem(CKEY);
    if(!raw) return null;
    const p = JSON.parse(raw);
    if(!p || !Array.isArray(p.order)) return null;
    const was  = Math.max(0, Math.min(Number(p.pos) || 0, p.order.length));
    const order = p.order.filter(id => QMAP.has(id));   // 消えた問題は落とす
    if(!order.length) return null;
    /* order を詰めたら pos も同じだけ戻す。数を据え置くと、pos より前で
       消えた件数ぶん先へ進みすぎ、その数だけ未出題の問題が飛ばされる */
    const gone = p.order.slice(0, was).filter(id => !QMAP.has(id)).length;
    return {
      order,
      pos  : Math.max(0, Math.min(was - gone, order.length)),
      wrong: Array.isArray(p.wrong) ? p.wrong.filter(id => QMAP.has(id)) : [],
      mode : p.mode === "wrong" ? "wrong" : "all",
      round: Number(p.round) || 1,
      done : !!p.done
    };
  }catch(e){ return null; }
}
function saveCycle(){
  try{
    if(cyc) localStorage.setItem(CKEY, JSON.stringify(cyc));
    else localStorage.removeItem(CKEY);
  }catch(e){ /* 保存できなくても出題は続行する */ }
}
function cycleTitle(c){
  const x = c || cyc;
  return x.mode === "wrong" ? "間違えた問題だけ・" + x.round + "周目" : "全問一周";
}

/* 後から足された問題を末尾に入れる。作問が続くので必須。
   間違えた問題だけの周には足さない。その周の対象はもう決まっているため。 */
function fillNew(){
  if(!cyc || cyc.mode !== "all" || cyc.done) return 0;
  const have = new Set(cyc.order);
  const add = shuffle(QUESTIONS.map(q => q.id).filter(id => !have.has(id)));
  if(add.length){ cyc.order = cyc.order.concat(add); saveCycle(); }
  return add.length;
}

function cycleNew(mode, ids){
  const prev = cyc;
  cyc = {
    order: shuffle(ids), pos:0, wrong:[], mode,
    round: mode === "wrong" ? ((prev && prev.round) || 1) + 1 : 1,
    done : false
  };
  cycOpen = {};
  saveCycle();
  cycleRun();
}

/* 残りを既存の出題画面に流し込む。items は order の並びのまま作り、
   それぞれに order 上の位置（cyc）を持たせる。深掘りで問題が割り込んでも
   「何問目か」がずれないようにするための番号である。 */
function cycleRun(){
  if(!cyc) return;
  const items = [];
  for(let i = cyc.pos; i < cyc.order.length; i++){
    const q = QMAP.get(cyc.order[i]);
    if(!q) continue;
    items.push({ q, order: shuffle(q.choices.map((c,j) => j)), picked:null, cyc:i });
  }
  if(!items.length){ cyc.done = true; saveCycle(); view = { name:"cycresult" }; return render(); }
  quiz = { title:cycleTitle(), items, i:0, answered:false, detailOpen:false, digOpen:false, cycle:true };
  view = { name:"quiz" };
  render();
}

/* 1問答えるごとに呼ぶ。ここで保存するので、途中でやめても続きから戻れる */
function cycleAnswered(it){
  if(!cyc || it.dug) return;
  cyc.pos = it.cyc + 1;
  const bad = it.picked !== it.q.answer;
  const at  = cyc.wrong.indexOf(it.q.id);
  if(bad && at < 0) cyc.wrong.push(it.q.id);
  if(!bad && at >= 0) cyc.wrong.splice(at, 1);   // 深掘りで戻って正解した場合
  if(cyc.pos >= cyc.order.length) cyc.done = true;
  saveCycle();
}

/* トップ画面の入口。タブは増やさず、タブの下に置く */
function cycHomeHTML(){
  let sub;
  if(!cyc) sub = QUESTIONS.length + "問を一度ずつ。1問ごとに保存されます";
  else if(cyc.done) sub = cycleTitle() + "を解き終えています　結果を見る";
  else sub = cycleTitle() + "の途中　残り" + (cyc.order.length - cyc.pos) + "問";
  return `<button class="cycbtn" data-cyc="open"><b>全問一周</b><span>${esc(sub)}</span></button>`;
}

function cycStartView(){
  let h = `<button class="back" data-home="1">一覧にもどる</button>
    <h2 class="term-title">全問一周</h2>`;
  if(!cyc){
    h += `<p class="term-note">${QUESTIONS.length}問を一度ずつ解きます。順番は始めるときに決まり、
      途中でやめても、次は同じ順序の続きから始まります。1回の出題数の設定はこのモードでは使いません。</p>
      <button class="btn" data-cyc="new">始める</button>`;

    <button class="btn" data-cyc="resume">続きから（残り${rest}問）</button>

/* 一周の終了画面。quiz ではなく保存した cyc から作る。
   リロードしたあとでも同じ画面に戻れるようにするため。 */
function cycResultView(){
  if(!cyc){ view = { name:"home", tab:"philosophers" }; return homeView(); }
  const n  = cyc.order.length;
  const ng = cyc.wrong.slice();
  const ok = n - ng.length;
  const rate = n ? Math.round(ok / n * 100) : 0;

  let h = `<div class="score">${rate}<small>%</small></div>
    <p class="score-note">${esc(cycleTitle())}　${n}問中 ${ok}問 正解</p>`;

  if(ng.length){
    h += `<h2 class="sec-title">間違えた問題　${ng.length}問</h2>`;
    h += ng.map(id => {
      const q = QMAP.get(id);
      if(!q) return "";
      const open = !!cycOpen[id];
      let s = `<button class="wrongrow" data-cycq="${esc(id)}" aria-expanded="${open}">${esc(q.question)}
        <span>${esc(q.philosophers.join("／"))}${open ? "" : "　押すと解説"}</span></button>`;
      if(open){
        s += `<p class="explain">${esc(q.explanation)}</p>`;
        if(q.detail) s += `<div class="detail">${esc(q.detail)}</div>`;
        if(q.source && q.source.unverified){
          s += `<div class="unverified"><b>確認できていない点</b>${esc(q.source.unverified)}</div>`;
        }
      }
      return s;
    }).join("");
    h += `<div class="foot"><button class="btn" data-cyc="wrong">間違えた${ng.length}問だけでもう一周</button>
      <button class="btn ghost" data-cyc="new">全問で最初から</button></div>`;
  }else{
    h += `<p class="empty">間違いはありません。</p>
      <div class="foot"><button class="btn" data-cyc="new">全問で最初から</button>
      <button class="btn ghost" data-home="1">一覧にもどる</button></div>`;
  }
  return h;
}

/* ========== 鍵語の一覧（検索で差し替える部分だけ） ========== */
const SORTS = [["kana","五十音"],["phil","人物ごと"],["count","問題数順"]];

/* 検索は語そのものと読みの両方に部分一致させる。
   「げんそんざい」でも「ゲンソンザイ」でも現存在が出るように、かなはひらがなへ寄せる */
function keyMatch(r, qy){
  return r.name.includes(qy) || kanaKey(r.name).includes(toHira(qy));
}
function keyRowsNow(){
  const qy = keyQuery.trim();
  return qy ? KEY_ROWS.filter(r => keyMatch(r, qy)) : KEY_ROWS;
}
function keyCountText(){
  const qy = keyQuery.trim();
  if(qy) return keyRowsNow().length + "語（" + esc(qy) + "）";
  const label = (SORTS.find(x => x[0] === keySort) || SORTS[0])[1];
  return KEY_ROWS.length + "語　" + label;
}
function krowHTML(r){
  const whoLabel = r.who.length > 2 ? r.who.slice(0,2).join("・") + " ほか" + (r.who.length-2) + "人" : r.who.join("・");
  const badge = r.kind === "concept" ? `<span class="kbadge">概念へ</span>` : "";
  return `<button class="krow" data-key="${esc(r.name)}" data-kind="${r.kind}">
    <span class="krow-name">${esc(r.name)}</span>${badge}
    <span class="krow-who">${esc(whoLabel)}</span>
    <span class="krow-n">${r.qs.length}問</span>
  </button>`;
}
function keyListHTML(){
  const qy = keyQuery.trim();
  const rows = keyRowsNow();
  if(!rows.length) return `<p class="empty">「${esc(qy)}」に当たる鍵語はありません。</p>`;
  /* 検索中は見出しを出さない。絞り込んだ結果を素直に並べる */
  if(qy) return rows.slice().sort(byKana).map(krowHTML).join("");

  if(keySort === "count") return rows.slice().sort(byCount).map(krowHTML).join("");

  if(keySort === "phil"){
    const order = PHILOSOPHERS.map(p => p.name);
    const groups = new Map();
    rows.forEach(r => { if(!groups.has(r.head)) groups.set(r.head, []); groups.get(r.head).push(r); });
    const names = [...groups.keys()].sort((a,b) => {
      const ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 9999 : ia) - (ib < 0 ? 9999 : ib);
    });
    return names.map(n => {
      const g = groups.get(n).slice().sort(byCount);
      return `<h3 class="kgrp" id="grp-${esc(n)}">${esc(n)}<span>${g.length}語</span></h3>` + g.map(krowHTML).join("");
    }).join("");
  }

  /* 五十音。頭の索引から見出しへ飛べるようにする */
  const gyos = GYO.map(x => x[0]).concat("他");
  const has = g => rows.some(r => r.gyo === g);
  let h = `<div class="gyoidx">` + gyos.filter(has).map(g =>
    `<button class="gyobtn" data-gyo="${g}">${g}</button>`).join("") + `</div>`;
  h += gyos.filter(has).map(g => {
    const gg = rows.filter(r => r.gyo === g).sort(byKana);
    return `<h3 class="kgrp" id="gyo-${g}">${g}行<span>${gg.length}語</span></h3>` + gg.map(krowHTML).join("");
  }).join("");
  return h;
}

/* ========== 出題 ========== */
function startQuiz(list, title, useLimit, philName){
  if(!list.length) return;
  let picked = shuffle(list);
  if(useLimit && store.limit > 0 && picked.length > store.limit) picked = picked.slice(0, store.limit);
  quiz = {
    title,
    items: picked.map(q => {
      const order = shuffle(q.choices.map((c,i) => i));
      return { q, order, picked:null };
    }),
    i:0, answered:false, detailOpen:false, digOpen:false,
    phil: philName || null
  };
  view = { name:"quiz" };
  render();
}

function quizView(){
  const it = quiz.items[quiz.i];
  const q = it.q;
  /* メタ行。人物名は一人ずつ押せるようにする（比較問題では各名が別の入口）。
     全問一周のときはヘッダーに人物名が出ないので、ここが唯一の入口になる */
  const tagPhil = q.philosophers.map(philLink).join("／");
  const tagTerm = esc(q.terms.join("・"));
  const tags = [tagPhil, tagTerm].filter(Boolean).join("　|　");
  /* 全問一周のときは「いま order の何番目か」を出す。
     深掘りで割り込んだ問題は、割り込まれた問題と同じ番号のままにする */
  const cy  = quiz.cycle && cyc;
  const num = cy ? it.cyc + 1 : quiz.i + 1;
  const den = cy ? cyc.order.length : quiz.items.length;
  const pct = (num - (quiz.answered ? 0 : 1)) / den * 100;

  const headTitle = (quiz.phil && hasIntro(quiz.phil))
    ? philLink(quiz.phil) : esc(quiz.title);

  let h = `<div class="q-bar"><button class="quitbtn" data-quit="1">やめる</button><span class="q-title">${headTitle}${it.dug ? "　深掘り" : ""}</span><b>${num} / ${den}</b></div>
    <div class="gauge"><span style="width:${pct}%"></span></div>
    <p class="q-tags">${tags}</p>
    <p class="q-text">${esc(q.question)}</p>`;

  h += it.order.map((orig, pos) => {
    let cls = "choice";
    if(quiz.answered){
      if(orig === q.answer) cls += " is-correct";
      else if(orig === it.picked) cls += " is-wrong";
      else cls += " is-dim";
    }
    return `<button class="${cls}" data-pick="${pos}" ${quiz.answered?"disabled":""}>${esc(q.choices[orig])}</button>`;
  }).join("");

  if(quiz.answered){
    const ok = it.picked === q.answer;
    const kindCls = q.source.kind === "book" ? "book" : "";
    const on = store.flags[q.id] ? "on" : "";
    h += `<p class="verdict ${ok?"ok":"ng"}">${ok?"正解":"不正解"}</p>
      <p class="explain">${esc(q.explanation)}</p>`;
    if(q.detail){
      if(quiz.detailOpen){
        h += `<div class="detail">${esc(q.detail)}</div>`;
        if(q.source.unverified){
          h += `<div class="unverified"><b>確認できていない点</b>${esc(q.source.unverified)}</div>`;
        }
      }else{
        h += `<button class="more" data-more="1">もっと詳しく</button>`;
      }
    }else{
      const w = store.wants[q.id] ? "on" : "";
      h += `<button class="more want ${w}" data-want="${q.id}">${w ? "書き足す問題に入れた" : "詳しい解説がほしい"}</button>`;
    }
    /* 全問一周では items に全問が入っているので、それを全部除くと深掘りが空になる。
       すでに答えた問題だけを除く */
    const seen = quiz.cycle
      ? new Set(quiz.items.filter(x => x.picked !== null).map(x => x.q.id))
      : new Set(quiz.items.map(x => x.q.id));
    const rel = related(q, seen);
    if(rel.length){
      h += quiz.digOpen
        ? `<div class="dig"><p class="dig-head">深掘り</p>` + rel.map(r => `<button class="dig-item" data-dig="${r.q.id}">
             <span class="dig-tag">${esc(r.why)}</span>${esc(r.q.question)}
             <span class="dig-why">${esc(r.q.philosophers.join("／"))}</span></button>`).join("") + `</div>`
        : `<button class="more" data-digopen="1">深掘り（関連する${rel.length}問）</button>`;
    }
    h += `<div><span class="src ${kindCls}">${esc(q.source.label)}</span>
      <button class="flagbtn ${on}" data-flag="${q.id}">${on?"印をつけた":"この解説はおかしい"}</button></div>
      <div class="foot"><button class="btn" data-next="1">${quiz.i+1 < quiz.items.length ? "次の問題" : "結果を見る"}</button></div>`;
  }
  return h;
}

function resultView(){
  const n = quiz.items.length;
  const ok = quiz.items.filter(it => it.picked === it.q.answer).length;
  const wrong = quiz.items.filter(it => it.picked !== it.q.answer).map(it => it.q);
  let h = `<div class="score">${ok}<small>/ ${n}</small></div>
    <p class="score-note">${esc(quiz.title)}</p>`;
  if(wrong.length){
    h += `<h2 class="sec-title">間違えた問題</h2>` +
      wrong.map(q => `<div class="mini">${esc(q.question)}<span>${esc(q.philosophers.join("／"))}</span></div>`).join("") +
      `<div class="foot"><button class="btn" data-retry="1">この${wrong.length}問をもう一度</button>
       <button class="btn ghost" data-home="1">一覧にもどる</button></div>`;
  }else{
    h += `<p class="empty">全問正解です。</p>
      <div class="foot"><button class="btn" data-home="1">一覧にもどる</button></div>`;
  }
  /* 人物モードを解き終えたときだけ、紹介をその場に一枚置く（シートではない）。
     全問一周の完了画面は cycResultView なので、ここには来ない */
  if(quiz.phil && hasIntro(quiz.phil)){
    h += `<div class="ph-card">` + philBodyHTML(PHIL_MAP[quiz.phil], true) + `</div>`;
  }
  return h;
}

/* ========== 操作 ========== */
app.addEventListener("click", e => {
  const el = e.target.closest("button");
  if(!el || el.disabled) return;
  const d = el.dataset;

  if(d.ph){ return openSheet(d.ph); }   /* 紹介シート。問題の状態はそのまま */

  if(d.tab){ view = { name:"home", tab:d.tab, sub:lastSub }; return render(); }
  if(d.sub){
    lastSub = d.sub; keyQuery = "";
    if(d.sub === "key") pickTodays();          // 開くたびに選び直す
    view = { name:"home", tab:"terms", sub:d.sub };
    return render();
  }
  if(d.sortkey){ keySort = d.sortkey; return render(); }
  if(d.gyo){                                    // 五十音の索引から見出しへ飛ぶ
    const el = document.getElementById("gyo-" + d.gyo);
    if(el) el.scrollIntoView({ block:"start" });
    return;
  }
  if(d.key){
    // 規則1。TERMS と重なる10語は概念側の見取り図へ送る。出題も概念側の集合になる
    if(d.kind === "concept"){ lastSub = "key"; view = { name:"term", term:d.key }; return render(); }
    lastSub = "key";
    return startQuiz(byKey(d.key), d.key, true);
  }
  if(d.cyc){
    if(d.cyc === "open"){
      fillNew();                                  // 増えた問題を末尾に足す
      view = { name: (cyc && cyc.done) ? "cycresult" : "cycstart" };
      return render();
    }
    if(d.cyc === "new")    return cycleNew("all", QUESTIONS.map(q => q.id));
    if(d.cyc === "resume"){ fillNew(); return cycleRun(); }
    if(d.cyc === "wrong"){
      const ids = cyc ? cyc.wrong.slice() : [];
      if(ids.length) return cycleNew("wrong", ids);
      return;
    }
  }
  if(d.cycq){                                     // 終了画面で解説を開く／閉じる
    cycOpen[d.cycq] = !cycOpen[d.cycq];
    const y = window.scrollY;
    render(true); window.scrollTo(0, y);
    return;
  }
  if(d.limit !== undefined){ store.limit = Number(d.limit); save(); return render(); }
  if(d.school !== undefined){ view = { name:"home", tab:"philosophers", school:d.school || null }; return render(); }
  if(d.fav){
    const y = window.scrollY;                    // ★を押しただけで先頭へ飛ばさない
    if(store.favs[d.fav]) delete store.favs[d.fav];
    else store.favs[d.fav] = true;
    save(); render(); window.scrollTo(0, y);
    return;
  }
  if(d.philosopher){ lastSchool = view.school || null; return startQuiz(byPhilosopher(d.philosopher), d.philosopher, true, d.philosopher); }
  if(d.term){ view = { name:"term", term:d.term }; return render(); }
  if(d.termStart){ return startQuiz(byTerm(d.termStart), d.termStart, true); }
  if(d.back || d.home){
    const tab = d.home ? (view.tab || "philosophers") : "terms";
    if(tab === "terms" && lastSub === "key") pickTodays();
    view = { name:"home", tab, sub:lastSub, school: lastSchool };
    return render();
  }

  if(d.quit){
    const done = quiz.items.filter(it => it.picked !== null).length;
    // 0問なら確認しない。誤タップで始めた直後がこれにあたる
    if(done && !confirm("出題をやめて一覧にもどります。ここまでの解答は記録に残ります。")) return;
    quiz = null;
    view = { name:"home", tab:"philosophers", sub:lastSub, school:lastSchool };
    return render();
  }
  if(d.pick !== undefined && !quiz.answered){
    const it = quiz.items[quiz.i];
    it.picked = it.order[Number(d.pick)];
    quiz.answered = true;
    record(it.q.id, it.picked === it.q.answer);
    if(quiz.cycle) cycleAnswered(it);      // 1問ごとに一周の進捗を保存する
    return render();
  }
  if(d.more){ quiz.detailOpen = true; return render(); }
  if(d.digopen){ quiz.digOpen = true; return render(); }
  if(d.dig){
    const q = QUESTIONS.find(x => x.id === d.dig);
    if(!q) return;
    const order = shuffle(q.choices.map((c,i) => i));
    quiz.items.splice(quiz.i + 1, 0, { q, order, picked:null, dug:true, cyc:quiz.items[quiz.i].cyc });
    quiz.i++; quiz.answered = false; quiz.detailOpen = false; quiz.digOpen = false;
    view = { name:"quiz" };
    return render();
  }
  if(d.want){
    store.wants[d.want] = !store.wants[d.want];
    save();
    return render();
  }
  if(d.next){
    if(quiz.i + 1 < quiz.items.length){ quiz.i++; quiz.answered = false; quiz.detailOpen = false; quiz.digOpen = false; view = { name:"quiz" }; }
    else view = { name: quiz.cycle ? "cycresult" : "result" };
    return render();
  }
  if(d.flag){
    store.flags[d.flag] = !store.flags[d.flag];
    save();
    return render();
  }
  if(d.retry){
    return startQuiz(quiz.items.filter(it => it.picked !== it.q.answer).map(it => it.q), quiz.title + "・復習");
  }
  if(d.start === "weak"){
    const list = Object.keys(store.results)
      .filter(i => store.results[i].last === false)
      .map(i => QUESTIONS.find(q => q.id === i)).filter(Boolean);
    return startQuiz(list, "間違えた問題");
  }
  if(d.reset){
    if(confirm("解いた記録と、問題につけた印をすべて消します。お気に入りは残ります。よろしいですか。")){
      const favs = store.favs;                   // お気に入りは設定なので消さない
      store = structuredClone(blank); store.favs = favs; save();
      view = { name:"home", tab:"log" }; render();
    }
  }
});

/* 鍵語の検索。
   入力欄には触らず、一覧の中身だけを差し替える。
   画面を作り直すと入力欄ごと作り直されてしまい、日本語入力の変換途中の状態が
   毎回壊れる。濁点・半濁点が入らない、漢字に変換できない、という不具合になる。

   変換中（compositionstart 〜 compositionend）は絞り込みを止める。
   「は」→「ば」のような途中の文字で一覧が空になるのを避けるため。
   変換が確定したら compositionend で絞り込み直す。 */
let composing = false;
app.addEventListener("compositionstart", e => {
  if(e.target.id === "keysearch") composing = true;
});
app.addEventListener("compositionend", e => {
  if(e.target.id !== "keysearch") return;
  composing = false;
  keyQuery = e.target.value;
  refreshKeyList();
});
app.addEventListener("input", e => {
  if(e.target.id !== "keysearch") return;
  keyQuery = e.target.value;
  if(composing) return;            // 変換中は一覧を動かさない
  refreshKeyList();
});

render();
</script>
</body>
